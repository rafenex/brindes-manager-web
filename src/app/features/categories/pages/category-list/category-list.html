<div class="page">

  <div class="page-header">
    <div>
      <h1>Categorias</h1>
      <p>Gerencie as categorias dos produtos.</p>
    </div>

    <p-button
      label="Nova categoria"
      icon="pi pi-plus"
      (onClick)="newCategory()"
    />
  </div>

  <div class="table-card">

    <p-table
      [value]="categories"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
    >

      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Descrição</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-category>
        <tr>
          <td>{{ category.name }}</td>
          <td>{{ category.description || '-' }}</td>
          <td>{{ category.active ? 'Ativo' : 'Inativo' }}</td>

          <td class="actions">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              (onClick)="editCategory(category.id)"
            />

            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              (onClick)="deleteCategory(category.id)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="empty">
            Nenhuma categoria cadastrada.
          </td>
        </tr>
      </ng-template>

    </p-table>

  </div>

</div>
