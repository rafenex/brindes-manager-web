<div class="page">

  <div class="page-header">
    <div>
      <h1>Usuários</h1>
      <p>Gerencie os usuários da sua empresa.</p>
    </div>

    @if (authService.isAdmin()) {
      <p-button
        label="Novo usuário"
        icon="pi pi-plus"
        (onClick)="newUser()"
      />
    }
  </div>

  <div class="table-card">

    <p-table
      [value]="users"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
    >

      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Perfil</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.active ? 'Ativo' : 'Inativo' }}</td>
          <td>
            @if (canManage(user)) {
              <p-button
                icon="pi pi-pencil"
                [ariaLabel]="'Editar ' + user.name"
                [text]="true"
                (onClick)="editUser(user)"
              />
              <p-button
                icon="pi pi-trash"
                [ariaLabel]="'Excluir ' + user.name"
                [text]="true"
                severity="danger"
                [loading]="deletingId === user.id"
                [disabled]="deletingId !== null"
                (onClick)="deleteUser(user)"
              />
            }
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty">
            Nenhum usuário cadastrado.
          </td>
        </tr>
      </ng-template>

    </p-table>

  </div>

</div>
