<div class="page">

  <div class="page-header">
    <div>
      <h1>Produtos</h1>
      <p>Gerencie os produtos cadastrados.</p>
    </div>

    <p-button
      label="Novo produto"
      icon="pi pi-plus"
      (onClick)="newProduct()"
    />
  </div>

  <div class="table-card">

    <p-table
      [value]="products"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
    >

      <ng-template pTemplate="header">
        <tr>
          <th>Referência</th>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Preço base</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.reference }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.categoryName }}</td>
          <td>
            {{ product.basePrice | currency:'BRL':'symbol':'1.2-2' }}
          </td>
          <td>
            {{ product.active ? 'Ativo' : 'Inativo' }}
          </td>

          <td class="actions">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              (onClick)="editProduct(product.id)"
            />

            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              (onClick)="deleteProduct(product.id)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="empty">
            Nenhum produto cadastrado.
          </td>
        </tr>
      </ng-template>

    </p-table>

  </div>

</div>
