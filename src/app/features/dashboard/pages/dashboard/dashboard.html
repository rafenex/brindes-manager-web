<div class="dashboard">
  <header class="header">
    <div>
      <h1>Dashboard</h1>
      <p>Visão geral do Brindes Gerenciador</p>
    </div>
  </header>

  <section class="cards">
    <div class="card">
      <span class="pi pi-users"></span>

      <div>
        <small>Clientes</small>
        {{ loading ? '...' : totalCustomers }}
      </div>
    </div>

    <div class="card">
      <span class="pi pi-box"></span>

      <div>
        <small>Produtos</small>
        {{ loading ? '...' : totalProducts }}
      </div>
    </div>

    <div class="card">
      <span class="pi pi-shopping-cart"></span>

      <div>
        <small>Pedidos</small>
        <strong> {{ loading ? '...' : totalOrders }} </strong>
      </div>
    </div>
  </section>
</div>
