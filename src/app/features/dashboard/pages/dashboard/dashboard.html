<div class="dashboard">
  <header class="header">
    <div>
      <h1>Brindes Manager</h1>
      <p>Dashboard</p>
    </div>

    <p-button
      label="Sair"
      icon="pi pi-sign-out"
      severity="secondary"
      (onClick)="logout()"
    />
  </header>

  <section class="cards">
    <div class="card">
      <span class="pi pi-users"></span>

      <div>
        <small>Clientes</small>
        <strong>--</strong>
      </div>
    </div>

    <div class="card">
      <span class="pi pi-box"></span>

      <div>
        <small>Produtos</small>
        <strong>--</strong>
      </div>
    </div>

    <div class="card">
      <span class="pi pi-shopping-cart"></span>

      <div>
        <small>Pedidos</small>
        <strong>--</strong>
      </div>
    </div>
  </section>
</div>
