<div class="page">
  <div class="form-card">
    <div class="header">
      <div>
        <h1>{{ customerId ? 'Editar cliente' : 'Novo cliente' }}</h1>

        <p>
          {{ customerId ? 'Atualize os dados do cliente.' : 'Cadastre os dados
          do cliente.' }}
        </p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()">
      <p role="status" aria-live="polite">{{ formNotice }}</p>
      <fieldset [disabled]="loading || saving">
      <div class="field">
        <label for="companyName">Empresa *</label>

        <input
          pInputText
          id="companyName"
          formControlName="companyName"
          placeholder="Nome da empresa"
        />
      </div>

      <div class="field">
        <label for="name">Nome do contato</label>

        <input
          pInputText
          id="name"
          formControlName="name"
          placeholder="Nome da pessoa de contato"
        />
      </div>

      <div class="field">
        <label for="postalCode">CEP</label>
        <input pInputText id="postalCode" formControlName="postalCode"
          autocomplete="postal-code" placeholder="00000-000"
          aria-describedby="postal-code-notice" (blur)="onPostalCodeBlur()" />
        <small id="postal-code-notice" role="status" aria-live="polite" aria-atomic="true">
          {{ lookupLoading ? 'Consultando CEP…' : postalCodeNotice }}
        </small>
      </div>
      <div class="field">
        <label for="street">Logradouro</label>
        <input pInputText id="street" formControlName="street" autocomplete="address-line1" />
      </div>
      <div class="field">
        <label for="number">Número</label>
        <input pInputText id="number" formControlName="number" autocomplete="off" />
      </div>
      <div class="field">
        <label for="complement">Complemento</label>
        <input pInputText id="complement" formControlName="complement" autocomplete="address-line2" />
      </div>
      <div class="field">
        <label for="neighborhood">Bairro</label>
        <input pInputText id="neighborhood" formControlName="neighborhood" autocomplete="off" />
      </div>
      <div class="field">
        <label for="city">Cidade</label>
        <input pInputText id="city" formControlName="city" autocomplete="address-level2" />
      </div>
      <div class="field">
        <label for="state">UF</label>
        <input pInputText id="state" formControlName="state" autocomplete="address-level1" />
      </div>

      <div class="field">
        <label for="document">CPF/CNPJ</label>

        <input
          pInputText
          id="document"
          formControlName="document"
          placeholder="Documento"
        />
      </div>

      <div class="field">
        <label for="email">E-mail</label>

        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="cliente@email.com"
        />
      </div>

      <div class="field">
        <label for="phone">Telefone</label>

        <input
          pInputText
          id="phone"
          formControlName="phone"
          placeholder="Telefone"
        />
      </div>

      </fieldset>
      <div class="actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="cancel()"
        />

        <p-button
          type="submit"
          label="Salvar"
          icon="pi pi-check"
          [loading]="saving"
          [disabled]="loading || saving || form.invalid"
        />
      </div>
    </form>
  </div>
</div>
